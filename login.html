<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3b33">
  <title>Log in · VenueBook</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-story" aria-label="VenueBook">
      <a class="auth-brand" href="index.html"><span class="auth-brand-mark">VenueBook</span></a>
      <div>
        <p class="auth-kicker">Make room for good work</p>
        <h1>Your next great session starts here.</h1>
        <p class="auth-story-copy">Find a space that fits your plans, bring your people together, and get straight to what matters.</p>
      </div>
      <p class="auth-story-foot">Find your place · Make it happen</p>
    </section>
    <section class="auth-content">
      <form id="f" class="auth-form">
        <p class="auth-eyebrow">Welcome back</p>
        <h2>Log in</h2>
        <p class="auth-intro">Pick up where you left off.</p>
        <div class="auth-fields">
          <input name="username" placeholder="Username" autocomplete="username" aria-label="Username" required>
          <input name="password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
          <button type="submit">Log in</button>
        </div>
        <div id="msg" class="auth-message" role="status" aria-live="polite"></div>
        <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('f').addEventListener('submit', async function (e) {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      const msg = document.getElementById('msg');
      const button = e.target.querySelector('button[type="submit"]');
      button.disabled = true;
      msg.textContent = '';
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await r.json().catch(() => null);
        if (!r.ok) throw new Error(data?.error || `Login failed (server returned ${r.status}).`);
        // Logged in! Go to the main booking page
        location.href = data.role === 'admin' ? 'admin.html' : 'index.html';
      } catch (err) {
        msg.textContent = err.message || 'Could not reach the server. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
