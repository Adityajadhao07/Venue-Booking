<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings · Venue Booking</title>
  <meta name="description" content="Track room requests and administrator decisions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Schibsted+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="index.html">Venue Booking</a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Venues</a>
        <a href="bookings.html" aria-current="page">My bookings</a>
        <a href="admin.html" id="adminNav" hidden>Admin</a>
        <button class="btn small ghost" type="button" onclick="logout()">Log out</button>
      </nav>
    </div>
  </header>
  <div class="demo-note" id="demoNote" hidden>Demo mode: the booking server is not reachable, so bookings are saved only in this browser.</div>

  <main class="wrap">
    <div class="page-head">
      <h1>My bookings</h1>
      <p>Track your requests and see when an administrator approves them.</p>
    </div>

    <div class="booking-summary" id="bookingSummary" hidden></div>
    <p class="booking-owner" id="bookingOwner"></p>

    <div id="out" aria-live="polite"></div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/bookings.js"></script>
  <script>
    async function logout() { await fetch('/api/logout', { method: 'POST' }); location.href = 'login.html'; }
  </script>
</body>
</html>
